<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosas que rebotan en mis bóvedas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { font-family: "EB Garamond", Garamond, "Times New Roman", serif; font-size: 20px; line-height: 1.4; background: #fff; color: #000; max-width: 640px; margin: 0 auto; padding: 12px; }
  a { color: #0000ee; } a:visited { color: #551a8b; }
  img { max-width: 100%; border: 1px solid #000; }
  canvas { max-width: 100%; border: 1px solid #000; display: block; }
  canvas[hidden] { display: none; }
  blockquote { margin: 1em 0 1em 1.5em; font-style: italic; }
  small { color: #666; }
  .post { margin: 1.5em 0; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Cosas que rebotan en mis bóvedas</h1>
<hr>
<div id="posts">Cargando...</div>
<script>
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}">${u}</a>`);

function render(p) {
  let h = '<div class="post">';
  if (p.title) h += `<b>${link(p.title)}</b><br>`;
  for (const f of p.files || []) {
    const u = `/media/${f.key}`;
    if (f.type.startsWith("image/")) h += `<img src="${u}" alt="${esc(f.name||"")}"><br>`;
    else if (f.type.startsWith("audio/")) h += `<audio controls src="${u}"></audio><br>`;
    else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name || "")) h += `<a href="${u}"><canvas data-pdf="${u}" hidden></canvas></a><a href="${u}">${esc(f.name||"PDF")}</a><br>`;
    else if (f.type.startsWith("video/")) h += `<video controls width="100%" src="${u}"></video><br>`;
    else h += `<a href="${u}">${esc(f.name||"file")}</a><br>`;
  }
  if (p.text) h += /^["“]/.test(p.text) ? `<blockquote>${link(p.text)}</blockquote>` : link(p.text) + "<br>";
  return h + `</div><hr>`;
}

// Same shuffled order for everyone, reshuffled every 30 days
function shuffle(list) {
  let a = Math.floor(Date.now() / (30 * 86400000)) >>> 0;
  const rand = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = [...list].sort((x, y) => x.id - y.id);
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

// First-page preview for PDFs (pdf.js loads only when a post has a PDF)
function pdfPreviews() {
  const cs = [...document.querySelectorAll("canvas[data-pdf]")];
  if (!cs.length) return;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const fail = (c, e) => c.closest("a").insertAdjacentHTML("afterend",
    "<small>Vista previa no disponible (" + esc(String((e && e.message) || e)) + ")</small><br>");
  const sc = document.createElement("script");
  sc.src = base + "pdf.min.js";
  sc.onerror = () => cs.forEach(c => fail(c, "no cargó pdf.js"));
  sc.onload = () => {
    pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    cs.forEach(async c => {
      try {
        const r = await fetch(c.dataset.pdf);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = new Uint8Array(await r.arrayBuffer());
        const pg = await (await pdfjsLib.getDocument({ data }).promise).getPage(1);
        const dpr = window.devicePixelRatio || 1;
        const w = document.getElementById("posts").clientWidth;
        const vp = pg.getViewport({ scale: (w / pg.getViewport({ scale: 1 }).width) * dpr });
        c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + "px";
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        c.hidden = false;
      } catch (e) { fail(c, e); }
    });
  };
  document.head.appendChild(sc);
}

fetch("/api/posts").then(r => r.json()).then(ps => {
  document.getElementById("posts").innerHTML = ps.length ? shuffle(ps).map(render).join("") : "Todavía no hay nada.";
  pdfPreviews();
}).catch(() => document.getElementById("posts").textContent = "No se pudieron cargar las publicaciones.");
</script>
</body>
</html>
