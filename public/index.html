<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosas que rebotan en mis bóvedas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🕯️</text></svg>">
<style>
  body { font-family: "Times New Roman", Times, serif; font-size: 18px; line-height: 1.4; background: #fff; color: #000; max-width: 640px; margin: 0 auto; padding: 12px; }
  a { color: #0000ee; } a:visited { color: #551a8b; }
  img { max-width: 100%; border: 1px solid #000; }
  canvas { max-width: 100%; border: 1px solid #000; display: block; }
  canvas[hidden] { display: none; }
  .ph { width: 100%; min-height: 200px; background: #eee; }
  blockquote { margin: 1em 0 1em 1.5em; font-style: italic; }
  .big { font-size: 1.8em; line-height: 1.2; }
  .center { text-align: center; }
  .sm { font-size: .8em; color: #444; }
  .mono { font-family: "Courier New", Courier, monospace; font-size: .9em; }
  small { color: #666; }
  .post { margin: 1.5em 0; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Cosas que rebotan en mis bóvedas</h1>
<hr>
<div id="posts">Cargando...</div>
<script src="/format.js"></script>
<script>

function render(p) {
  let h = '<div class="post">';
  if (p.title) h += `<b>${fmt(p.title)}</b><br>`;
  for (const f of p.files || []) {
    const u = `/media/${f.key}`;
    if (f.type.startsWith("image/")) h += `<img class="ph" loading="lazy" decoding="async" src="${u}" alt="${esc(f.name||"")}" onload="this.classList.remove('ph')"><br>`;
    else if (f.type.startsWith("audio/")) h += `<audio controls preload="none" src="${u}"></audio><br>`;
    else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name || "")) h += `<a href="${u}"><canvas data-pdf="${u}"></canvas></a><a href="${u}">${esc(f.name||"PDF")}</a><br>`;
    else if (f.type.startsWith("video/")) h += `<video class="ph" controls playsinline preload="none" width="100%" data-src="${u}#t=0.1" onloadedmetadata="this.classList.remove('ph')"></video><br>`;
    else h += `<a href="${u}">${esc(f.name||"file")}</a><br>`;
  }
  if (p.text) h += styled(p.style, p.text);
  return h + `</div><hr>`;
}

// Same shuffled order for everyone, reshuffled every 30 days
function shuffle(list) {
  let a = Math.floor(Date.now() / (30 * 86400000)) >>> 0;
  const rand = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = [...list].sort((x, y) => x.id - y.id);
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

// Start loading videos only when they get close to the screen
function lazyVideos() {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const v = e.target; io.unobserve(v); v.preload = "metadata"; v.src = v.dataset.src;
  }), { rootMargin: "400px" });
  document.querySelectorAll("video[data-src]:not([data-seen])").forEach(v => { v.dataset.seen = 1; io.observe(v); });
}

// First-page preview for PDFs, drawn only when near the screen (pdf.js loads on first use)
let lib;
function pdfPreviews() {
  const cs = [...document.querySelectorAll("canvas[data-pdf]:not([data-seen])")];
  if (!cs.length) return;
  cs.forEach(c => { c.dataset.seen = 1; });
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const load = () => lib || (lib = new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = base + "pdf.min.js";
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; ok(); };
    sc.onerror = () => no(new Error("no cargó pdf.js"));
    document.head.appendChild(sc);
  }));
  const fail = (c, e) => {
    c.hidden = true;
    c.closest("a").insertAdjacentHTML("afterend",
      "<small>Vista previa no disponible (" + esc(String((e && e.message) || e)) + ")</small><br>");
  };
  const draw = async c => {
    try {
      await load();
      const r = await fetch(c.dataset.pdf);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = new Uint8Array(await r.arrayBuffer());
      const pg = await (await pdfjsLib.getDocument({ data }).promise).getPage(1);
      const dpr = window.devicePixelRatio || 1;
      const w = document.getElementById("posts").clientWidth;
      const vp = pg.getViewport({ scale: (w / pg.getViewport({ scale: 1 }).width) * dpr });
      c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + "px";
      await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    } catch (e) { fail(c, e); }
  };
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); draw(e.target); }
  }), { rootMargin: "400px" });
  cs.forEach(c => io.observe(c));
}

fetch("/api/posts").then(r => r.json()).then(ps => {
  const box = document.getElementById("posts");
  if (!ps.length) { box.textContent = "Todavía no hay nada."; return; }
  const list = shuffle(ps), BATCH = 10;
  let n = 0;
  box.innerHTML = "";
  const sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  box.after(sentinel);
  const more = () => {
    box.insertAdjacentHTML("beforeend", list.slice(n, n + BATCH).map(render).join(""));
    n += BATCH;
    pdfPreviews(); lazyVideos();
    if (n >= list.length) { io.disconnect(); sentinel.remove(); }
    else { io.unobserve(sentinel); io.observe(sentinel); }
  };
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, { rootMargin: "800px" });
  io.observe(sentinel);
}).catch(() => document.getElementById("posts").textContent = "No se pudieron cargar las publicaciones.");
</script>
</body>
</html>
