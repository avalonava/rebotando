<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { font-family: "EB Garamond", Garamond, "Times New Roman", serif; font-size: 20px; line-height: 1.4; max-width: 640px; margin: 0 auto; padding: 12px; background: #fff; color: #000; }
  input, textarea, button { font: inherit; width: 100%; box-sizing: border-box; margin: 4px 0; padding: 6px; border: 1px solid #000; border-radius: 0; background: #fff; }
  button { width: auto; padding: 6px 14px; cursor: pointer; }
  textarea { min-height: 5em; }
  img { max-width: 120px; max-height: 120px; border: 1px solid #000; margin-right: 6px; }
  video, canvas { display: block; max-width: 200px; border: 1px solid #000; margin: 4px 0; }
  canvas[hidden] { display: none; }
  audio { display: block; max-width: 100%; margin: 4px 0; }
  .post { margin: 1.5em 0; } small { color: #666; }
</style>
</head>
<body>
<h1>Editar</h1>
<div id="login" hidden>
  <p>Clave secreta:</p>
  <input id="k" type="password" autocomplete="current-password">
  <button id="go">Entrar</button> <small id="err"></small>
</div>
<div id="new" hidden>
  <h2>Nueva publicación</h2>
  <input id="nt" placeholder="Título">
  <textarea id="nx" placeholder="Texto o enlace"></textarea>
  <input id="nf" type="file" multiple>
  <label><input id="sep" type="checkbox" style="width:auto"> Una publicación por archivo (ignora título y texto)</label><br>
  <button id="pub">Publicar</button> <small id="ns"></small>
  <progress id="bar" max="100" value="0" hidden style="width:100%;height:14px;margin-top:6px"></progress>
</div>
<div id="list"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let KEY = "";
try { KEY = localStorage.getItem("key") || ""; } catch (e) {}

const api = body => fetch("/api/edit?key=" + encodeURIComponent(KEY), { method: "POST", body: JSON.stringify(body) });

const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name || "");
let count = {};
const thumb = f => {
  const u = "/media/" + f.key;
  const dup = count[(f.name || "").toLowerCase()] > 1 ? " ⚠ repetido" : "";
  const label = `<small>${esc(f.name || "archivo")}${dup}</small><br>`;
  if (f.type.startsWith("image/")) return `<img src="${u}"><br>` + label;
  if (f.type.startsWith("video/")) return `<video src="${u}#t=0.1" controls preload="metadata" playsinline></video>` + label;
  if (f.type.startsWith("audio/")) return `<audio src="${u}" controls preload="none"></audio>` + label;
  if (isPdf(f)) return `<canvas data-pdf="${u}" hidden></canvas>` + label;
  return label;
};

function pdfPreviews() {
  const cs = [...document.querySelectorAll("canvas[data-pdf]")];
  if (!cs.length) return;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const sc = document.createElement("script");
  sc.src = base + "pdf.min.js";
  sc.onload = () => {
    pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    cs.forEach(async c => {
      try {
        const r = await fetch(c.dataset.pdf);
        if (!r.ok) throw 0;
        const data = new Uint8Array(await r.arrayBuffer());
        const pg = await (await pdfjsLib.getDocument({ data }).promise).getPage(1);
        const dpr = window.devicePixelRatio || 1;
        const vp = pg.getViewport({ scale: (200 / pg.getViewport({ scale: 1 }).width) * dpr });
        c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + "px";
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        c.hidden = false;
      } catch (e) {}
    });
  };
  document.head.appendChild(sc);
}

async function start() {
  if (!KEY || !(await api({ check: 1 })).ok) { $("login").hidden = false; return; }
  $("login").hidden = true;
  $("new").hidden = false;
  const ps = await (await fetch("/api/posts")).json();
  const nm = p => ((p.files && p.files[0] && p.files[0].name) || "").toLowerCase();
  ps.sort((a, b) => {
    const x = nm(a), y = nm(b);
    if (!x !== !y) return x ? -1 : 1;
    return x.localeCompare(y, undefined, { numeric: true }) || a.id - b.id;
  });
  count = {};
  ps.forEach(p => (p.files || []).forEach(f => { const k = (f.name || "").toLowerCase(); count[k] = (count[k] || 0) + 1; }));
  $("list").innerHTML = ps.length ? ps.map(p => `
    <div class="post" data-id="${p.id}"><hr>
      ${(p.files || []).map(thumb).join("")}
      <input class="t" placeholder="Título" value="${esc(p.title)}">
      <textarea class="x" placeholder="Texto">${esc(p.text)}</textarea>
      <button>Guardar</button> <button class="del">Borrar</button> <small class="s"></small>
    </div>`).join("") : "Todavía no hay nada.";
  pdfPreviews();
}

$("go").onclick = async () => {
  KEY = $("k").value;
  if ((await api({ check: 1 })).ok) { try { localStorage.setItem("key", KEY); } catch (e) {} start(); }
  else { KEY = ""; $("err").textContent = "Clave incorrecta."; }
};

$("list").addEventListener("click", async e => {
  if (e.target.tagName !== "BUTTON") return;
  const d = e.target.closest(".post"), s = d.querySelector(".s");
  if (e.target.classList.contains("del")) {
    if (!confirm("¿Borrar esta publicación y sus archivos? No se puede deshacer.")) return;
    s.textContent = "Borrando...";
    const r = await api({ id: d.dataset.id, delete: true });
    if (r.ok) d.remove(); else s.textContent = "Error al borrar.";
    return;
  }
  s.textContent = "Guardando...";
  const r = await api({ id: d.dataset.id, title: d.querySelector(".t").value, text: d.querySelector(".x").value });
  s.textContent = r.ok ? "Guardado." : "Error al guardar.";
});

const CHUNK = 4 * 1024 * 1024;
const st = $("ns"), bar = $("bar");
let total = 0, done = 0, last = 0, msg = "";
const posted = new Set();
const fkey = f => `${f.name}|${f.size}|${f.lastModified}`;
$("nf").onchange = () => posted.clear();

function show(bytes) {
  const pct = total ? Math.min(100, Math.round(bytes / total * 100)) : 0;
  bar.value = pct; st.style.color = ""; st.textContent = `${msg} · ${pct}%`;
}

function xhrUpload(qs, body, type, track) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/upload?key=" + encodeURIComponent(KEY) + "&" + qs);
    x.setRequestHeader("content-type", type);
    x.timeout = 120000;
    x.upload.onprogress = e => { last = Date.now(); if (track) show(done + e.loaded); };
    x.onload = () => x.status === 200 ? resolve() : reject(new Error("HTTP " + x.status));
    x.onerror = () => reject(new Error("sin conexión"));
    x.ontimeout = () => reject(new Error("tiempo agotado"));
    x.send(body);
  });
}

async function withRetry(fn) {
  for (let a = 1; ; a++) {
    try { last = Date.now(); return await fn(); }
    catch (e) {
      if (a >= 3) throw e;
      st.style.color = "#b00"; st.textContent = `Falló (${e.message}). Reintentando ${a}/2...`;
      await new Promise(r => setTimeout(r, 2000 * a));
    }
  }
}

async function sendPost(id, title, text, fs, label) {
  const files = [];
  for (const [i, f] of fs.entries()) {
    const parts = Math.ceil(f.size / CHUNK), type = f.type || "application/octet-stream";
    msg = label + f.name;
    for (let p = 0; p < parts; p++) {
      const blob = f.slice(p * CHUNK, (p + 1) * CHUNK);
      await withRetry(() => xhrUpload(`kind=part&post=${id}&file=${i}&part=${p}&parts=${parts}` +
        `&type=${encodeURIComponent(type)}&name=${encodeURIComponent(f.name)}`, blob, "application/octet-stream", true));
      done += blob.size; show(done);
    }
    files.push({ key: `${id}-${i}`, type, name: f.name });
  }
  await withRetry(() => xhrUpload("kind=post", JSON.stringify({ id, title, text, files }), "application/json", false));
}

$("pub").onclick = async () => {
  const title = $("nt").value.trim(), text = $("nx").value.trim();
  const fs = [...$("nf").files].filter(f => f.size > 0);
  if (!title && !text && !fs.length) return;
  const sep = $("sep").checked && fs.length > 1;
  const todo = sep ? fs.filter(f => !posted.has(fkey(f))) : fs;
  total = todo.reduce((n, f) => n + f.size, 0); done = 0; last = Date.now();
  $("pub").disabled = true; bar.hidden = false; bar.value = 0;
  const watch = setInterval(() => {
    const secs = Math.round((Date.now() - last) / 1000);
    if (secs >= 20) { st.style.color = "#b00"; st.textContent = `⚠ Sin avances desde hace ${secs} s. Sigue intentando...`; }
  }, 3000);
  try {
    const base = Date.now();
    if (sep) {
      for (const [n, f] of todo.entries()) {
        await sendPost(String(base + n), "", "", [f], `Archivo ${n + 1}/${todo.length}: `);
        posted.add(fkey(f));
      }
    } else { msg = ""; await sendPost(String(base), title, text, fs, ""); }
    $("nt").value = $("nx").value = $("nf").value = ""; posted.clear();
    bar.value = 100; st.style.color = ""; st.textContent = "Publicado."; start();
    setTimeout(() => { bar.hidden = true; }, 2500);
  } catch (e) {
    st.style.color = "#b00";
    st.textContent = `✖ Falló: ${e.message || "error"}. Toca Publicar para reintentar.`;
  }
  clearInterval(watch);
  $("pub").disabled = false;
};

start();
</script>
</body>
</html>
