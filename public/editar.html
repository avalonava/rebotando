<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🕯️</text></svg>">
<style>
  body { font-family: "Times New Roman", Times, serif; font-size: 18px; line-height: 1.4; max-width: 640px; margin: 0 auto; padding: 12px; background: #fff; color: #000; }
  input, textarea, button, select { font: inherit; width: 100%; box-sizing: border-box; margin: 4px 0; padding: 6px; border: 1px solid #000; border-radius: 0; background: #fff; }
  button { width: auto; padding: 6px 14px; cursor: pointer; }
  textarea { min-height: 5em; }
  .ed select { width: auto; }
  blockquote { margin: 1em 0 1em 1.5em; font-style: italic; }
  .big { font-size: 1.8em; line-height: 1.2; }
  .center { text-align: center; }
  .sm { font-size: .8em; color: #444; }
  .mono { font-family: "Courier New", Courier, monospace; font-size: .9em; }
  .pv { white-space: pre-wrap; border-left: 3px double #999; padding-left: 8px; margin: 6px 0; }
  .pv:empty { display: none; }
  img { max-width: 120px; max-height: 120px; border: 1px solid #000; margin-right: 6px; }
  video, canvas { display: block; max-width: 200px; border: 1px solid #000; margin: 4px 0; }
  canvas[hidden] { display: none; }
  audio { display: block; max-width: 100%; margin: 4px 0; }
  .post { margin: 1.5em 0; } small { color: #666; }
</style>
</head>
<body>
<h1>Editar</h1>
<div id="login" hidden>
  <p>Clave secreta:</p>
  <input id="k" type="password" autocomplete="current-password">
  <button id="go">Entrar</button> <small id="err"></small>
</div>
<div id="new" hidden>
  <h2>Nueva publicación</h2>
  <input id="nt" placeholder="Título">
  <div id="ned" class="ed"></div>
  <input id="nf" type="file" multiple>
  <label><input id="sep" type="checkbox" style="width:auto"> Una publicación por archivo (ignora título y texto)</label><br>
  <button id="pub">Publicar</button> <small id="ns"></small>
  <progress id="bar" max="100" value="0" hidden style="width:100%;height:14px;margin-top:6px"></progress>
</div>
<div id="tools" hidden><button id="dd">Quitar repetidos</button> <button id="da" style="border-color:#b00;color:#b00">Borrar todo</button> <small id="ds"></small></div>
<div id="list"></div>
<script src="/format.js"></script>
<script>
const $ = id => document.getElementById(id);
let KEY = "";
try { KEY = localStorage.getItem("key") || ""; } catch (e) {}

const api = body => fetch("/api/edit?key=" + encodeURIComponent(KEY), { method: "POST", body: JSON.stringify(body) });

const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name || "");
const OPTS = [["auto","Automático"],["normal","Normal"],["cita","Cita"],["grande","Grande"],["centrado","Centrado"],["pequeno","Pequeño"],["mono","Monoespaciado"]];
const editor = (style, text) => `<div class="ed">
  <select class="st">${OPTS.map(([v, l]) => `<option value="${v}"${v === style ? " selected" : ""}>${l}</option>`).join("")}</select>
  <button type="button" class="fm" data-k="b"><b>B</b></button>
  <button type="button" class="fm" data-k="i"><i>I</i></button>
  <button type="button" class="fm" data-k="a">Enlace</button>
  <textarea class="x" placeholder="Texto">${esc(text)}</textarea>
  <div class="pv"></div></div>`;

function preview(ed) {
  const t = ed.querySelector(".x").value.trim();
  ed.querySelector(".pv").innerHTML = t ? styled(ed.querySelector(".st").value, t) : "";
}

function applyFmt(btn) {
  const ta = btn.closest(".ed").querySelector(".x");
  const a = ta.selectionStart, b = ta.selectionEnd, sel = ta.value.slice(a, b) || "texto";
  let out;
  if (btn.dataset.k === "b") out = `**${sel}**`;
  else if (btn.dataset.k === "i") out = `*${sel}*`;
  else {
    const url = prompt("Dirección del enlace:", "https://");
    if (!url) return;
    out = `[${sel}](${url})`;
  }
  ta.setRangeText(out, a, b, "end");
  ta.focus();
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}

document.addEventListener("click", e => { const fb = e.target.closest(".fm"); if (fb) applyFmt(fb); });
document.addEventListener("input", e => { const ed = e.target.closest(".ed"); if (ed) preview(ed); });
document.addEventListener("change", e => { const ed = e.target.closest(".ed"); if (ed) preview(ed); });

$("ned").innerHTML = editor("auto", "");
$("ned").querySelector(".x").id = "nx";
$("ned").querySelector(".st").id = "nst";

let count = {}, posts = [];
const thumb = f => {
  const u = "/media/" + f.key;
  const dup = count[(f.name || "").toLowerCase()] > 1 ? " ⚠ repetido" : "";
  const label = `<small>${esc(f.name || "archivo")}${dup}</small><br>`;
  if (f.type.startsWith("image/")) return `<img src="${u}"><br>` + label;
  if (f.type.startsWith("video/")) return `<video src="${u}#t=0.1" controls preload="metadata" playsinline></video>` + label;
  if (f.type.startsWith("audio/")) return `<audio src="${u}" controls preload="none"></audio>` + label;
  if (isPdf(f)) return `<canvas data-pdf="${u}" hidden></canvas>` + label;
  return label;
};

function pdfPreviews() {
  const cs = [...document.querySelectorAll("canvas[data-pdf]")];
  if (!cs.length) return;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const sc = document.createElement("script");
  sc.src = base + "pdf.min.js";
  sc.onload = () => {
    pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    cs.forEach(async c => {
      try {
        const r = await fetch(c.dataset.pdf);
        if (!r.ok) throw 0;
        const data = new Uint8Array(await r.arrayBuffer());
        const pg = await (await pdfjsLib.getDocument({ data }).promise).getPage(1);
        const dpr = window.devicePixelRatio || 1;
        const vp = pg.getViewport({ scale: (200 / pg.getViewport({ scale: 1 }).width) * dpr });
        c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + "px";
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        c.hidden = false;
      } catch (e) {}
    });
  };
  document.head.appendChild(sc);
}

async function start() {
  if (!KEY || !(await api({ check: 1 })).ok) { $("login").hidden = false; return; }
  $("login").hidden = true;
  $("new").hidden = false;
  const ps = await (await fetch("/api/posts")).json();
  const nm = p => ((p.files && p.files[0] && p.files[0].name) || "").toLowerCase();
  ps.sort((a, b) => {
    const x = nm(a), y = nm(b);
    if (!x !== !y) return x ? -1 : 1;
    return x.localeCompare(y, undefined, { numeric: true }) || a.id - b.id;
  });
  posts = ps;
  $("tools").hidden = false;
  count = {};
  ps.forEach(p => (p.files || []).forEach(f => { const k = (f.name || "").toLowerCase(); count[k] = (count[k] || 0) + 1; }));
  $("list").innerHTML = ps.length ? ps.map(p => `
    <div class="post" data-id="${p.id}"><hr>
      ${(p.files || []).map(thumb).join("")}
      <input class="t" placeholder="Título" value="${esc(p.title)}">
      ${editor(p.style || "auto", p.text)}
      <button>Guardar</button> <button class="del">Borrar</button> <small class="s"></small>
    </div>`).join("") : "Todavía no hay nada.";
  document.querySelectorAll("#list .ed").forEach(preview);
  pdfPreviews();
}

$("go").onclick = async () => {
  KEY = $("k").value;
  if ((await api({ check: 1 })).ok) { try { localStorage.setItem("key", KEY); } catch (e) {} start(); }
  else { KEY = ""; $("err").textContent = "Clave incorrecta."; }
};

$("list").addEventListener("click", async e => {
  if (e.target.closest(".fm")) return;
  if (e.target.tagName !== "BUTTON") return;
  const d = e.target.closest(".post"), s = d.querySelector(".s");
  if (e.target.classList.contains("del")) {
    if (!confirm("¿Borrar esta publicación y sus archivos? No se puede deshacer.")) return;
    s.textContent = "Borrando...";
    const r = await api({ id: d.dataset.id, delete: true });
    if (r.ok) d.remove(); else s.textContent = "Error al borrar.";
    return;
  }
  s.textContent = "Guardando...";
  const r = await api({ id: d.dataset.id, title: d.querySelector(".t").value, text: d.querySelector(".x").value, style: d.querySelector(".st").value });
  s.textContent = r.ok ? "Guardado." : "Error al guardar.";
});

const CHUNK = 4 * 1024 * 1024;
const st = $("ns"), bar = $("bar");
let total = 0, done = 0, last = 0, msg = "";
const posted = new Set();
const fkey = f => `${f.name}|${f.size}|${f.lastModified}`;
$("nf").onchange = () => posted.clear();

function show(bytes) {
  const pct = total ? Math.min(100, Math.round(bytes / total * 100)) : 0;
  bar.value = pct; st.style.color = ""; st.textContent = `${msg} · ${pct}%`;
}

function xhrUpload(qs, body, type, track) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/upload?key=" + encodeURIComponent(KEY) + "&" + qs);
    x.setRequestHeader("content-type", type);
    x.timeout = 120000;
    x.upload.onprogress = e => { last = Date.now(); if (track) show(done + e.loaded); };
    x.onload = () => x.status === 200 ? resolve() : reject(new Error("HTTP " + x.status));
    x.onerror = () => reject(new Error("sin conexión"));
    x.ontimeout = () => reject(new Error("tiempo agotado"));
    x.send(body);
  });
}

async function withRetry(fn) {
  for (let a = 1; ; a++) {
    try { last = Date.now(); return await fn(); }
    catch (e) {
      if (a >= 3) throw e;
      st.style.color = "#b00"; st.textContent = `Falló (${e.message}). Reintentando ${a}/2...`;
      await new Promise(r => setTimeout(r, 2000 * a));
    }
  }
}

async function sendPost(id, title, text, fs, label, style) {
  const files = [];
  for (const [i, f] of fs.entries()) {
    const parts = Math.ceil(f.size / CHUNK), type = f.type || "application/octet-stream";
    msg = label + f.name;
    for (let p = 0; p < parts; p++) {
      const blob = f.slice(p * CHUNK, (p + 1) * CHUNK);
      await withRetry(() => xhrUpload(`kind=part&post=${id}&file=${i}&part=${p}&parts=${parts}` +
        `&type=${encodeURIComponent(type)}&name=${encodeURIComponent(f.name)}`, blob, "application/octet-stream", true));
      done += blob.size; show(done);
    }
    files.push({ key: `${id}-${i}`, type, name: f.name });
  }
  await withRetry(() => xhrUpload("kind=post", JSON.stringify({ id, title, text, style, files }), "application/json", false));
}

$("pub").onclick = async () => {
  const title = $("nt").value.trim(), text = $("nx").value.trim();
  const fs = [...$("nf").files].filter(f => f.size > 0);
  if (!title && !text && !fs.length) return;
  const sep = $("sep").checked && fs.length > 1;
  const todo = sep ? fs.filter(f => !posted.has(fkey(f))) : fs;
  total = todo.reduce((n, f) => n + f.size, 0); done = 0; last = Date.now();
  $("pub").disabled = true; bar.hidden = false; bar.value = 0;
  const watch = setInterval(() => {
    const secs = Math.round((Date.now() - last) / 1000);
    if (secs >= 20) { st.style.color = "#b00"; st.textContent = `⚠ Sin avances desde hace ${secs} s. Sigue intentando...`; }
  }, 3000);
  try {
    const base = Date.now();
    if (sep) {
      for (const [n, f] of todo.entries()) {
        await sendPost(String(base + n), "", "", [f], `Archivo ${n + 1}/${todo.length}: `);
        posted.add(fkey(f));
      }
    } else { msg = ""; await sendPost(String(base), title, text, fs, "", $("nst").value); }
    $("nt").value = $("nx").value = $("nf").value = ""; posted.clear(); preview($("ned"));
    bar.value = 100; st.style.color = ""; st.textContent = "Publicado."; start();
    setTimeout(() => { bar.hidden = true; }, 2500);
  } catch (e) {
    st.style.color = "#b00";
    st.textContent = `✖ Falló: ${e.message || "error"}. Toca Publicar para reintentar.`;
  }
  clearInterval(watch);
  $("pub").disabled = false;
};

$("dd").onclick = async () => {
  const ds = $("ds"), groups = {};
  posts.forEach(p => {
    const k = (p.files && p.files.length)
      ? p.files.map(f => (f.name || "").toLowerCase()).sort().join("|")
      : "t:" + p.title + "|" + p.text;
    (groups[k] = groups[k] || []).push(p);
  });
  const del = [];
  Object.values(groups).forEach(g => {
    if (g.length < 2) return;
    const keep = Math.floor(Math.random() * g.length);
    g.forEach((p, i) => { if (i !== keep) del.push(p); });
  });
  if (!del.length) { ds.textContent = "No hay repetidos."; return; }
  if (!confirm(`Se borrarán ${del.length} publicaciones repetidas (se queda una al azar de cada grupo). ` +
    `Solo se comparan los nombres de archivo, no el contenido. No se puede deshacer. ¿Seguir?`)) return;
  $("dd").disabled = true;
  try {
    for (const [n, p] of del.entries()) {
      ds.textContent = `Borrando ${n + 1}/${del.length}...`;
      if (!(await api({ id: p.id, delete: true })).ok) throw 0;
    }
    ds.textContent = `Listo: ${del.length} borradas.`;
  } catch (e) { ds.textContent = "Error al borrar; revisa la lista."; }
  $("dd").disabled = false; start();
};

$("da").onclick = async () => {
  const ds = $("ds");
  if (!posts.length) { ds.textContent = "No hay nada que borrar."; return; }
  const ok = prompt(`Se borrarán las ${posts.length} publicaciones y todos sus archivos. No se puede deshacer.\n\nEscribe BORRAR para confirmar:`);
  if (ok !== "BORRAR") { ds.textContent = "Cancelado."; return; }
  $("da").disabled = $("dd").disabled = true;
  try {
    const all = [...posts];
    for (const [n, p] of all.entries()) {
      ds.textContent = `Borrando ${n + 1}/${all.length}...`;
      if (!(await api({ id: p.id, delete: true })).ok) throw 0;
    }
    ds.textContent = "Limpiando archivos sueltos...";
    if (!(await api({ purge: true })).ok) throw 0;
    ds.textContent = "Todo borrado.";
  } catch (e) { ds.textContent = "Error al borrar; revisa la lista y vuelve a intentarlo."; }
  $("da").disabled = $("dd").disabled = false; start();
};

start();
</script>
</body>
</html>
