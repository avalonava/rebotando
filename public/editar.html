<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { font-family: "EB Garamond", Garamond, "Times New Roman", serif; font-size: 20px; line-height: 1.4; max-width: 640px; margin: 0 auto; padding: 12px; background: #fff; color: #000; }
  input, textarea, button { font: inherit; width: 100%; box-sizing: border-box; margin: 4px 0; padding: 6px; border: 1px solid #000; border-radius: 0; background: #fff; }
  button { width: auto; padding: 6px 14px; cursor: pointer; }
  textarea { min-height: 5em; }
  img { max-width: 120px; max-height: 120px; border: 1px solid #000; margin-right: 6px; }
  .post { margin: 1.5em 0; } small { color: #666; }
</style>
</head>
<body>
<h1>Editar</h1>
<div id="login" hidden>
  <p>Clave secreta:</p>
  <input id="k" type="password" autocomplete="current-password">
  <button id="go">Entrar</button> <small id="err"></small>
</div>
<div id="new" hidden>
  <h2>Nueva publicación</h2>
  <input id="nt" placeholder="Título">
  <textarea id="nx" placeholder="Texto o enlace"></textarea>
  <input id="nf" type="file" multiple>
  <button id="pub">Publicar</button> <small id="ns"></small>
</div>
<div id="list"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let KEY = "";
try { KEY = localStorage.getItem("key") || ""; } catch (e) {}

const api = body => fetch("/api/edit?key=" + encodeURIComponent(KEY), { method: "POST", body: JSON.stringify(body) });

async function start() {
  if (!KEY || !(await api({ check: 1 })).ok) { $("login").hidden = false; return; }
  $("login").hidden = true;
  $("new").hidden = false;
  const ps = await (await fetch("/api/posts")).json();
  $("list").innerHTML = ps.length ? ps.map(p => `
    <div class="post" data-id="${p.id}"><hr>
      ${(p.files || []).map(f => f.type.startsWith("image/") ? `<img src="/media/${f.key}">` : `<small>${esc(f.name || "archivo")}</small> `).join("")}
      <input class="t" placeholder="Título" value="${esc(p.title)}">
      <textarea class="x" placeholder="Texto">${esc(p.text)}</textarea>
      <button>Guardar</button> <small class="s"></small>
    </div>`).join("") : "Todavía no hay nada.";
}

$("go").onclick = async () => {
  KEY = $("k").value;
  if ((await api({ check: 1 })).ok) { try { localStorage.setItem("key", KEY); } catch (e) {} start(); }
  else { KEY = ""; $("err").textContent = "Clave incorrecta."; }
};

$("list").addEventListener("click", async e => {
  if (e.target.tagName !== "BUTTON") return;
  const d = e.target.closest(".post"), s = d.querySelector(".s");
  s.textContent = "Guardando...";
  const r = await api({ id: d.dataset.id, title: d.querySelector(".t").value, text: d.querySelector(".x").value });
  s.textContent = r.ok ? "Guardado." : "Error al guardar.";
});

const CHUNK = 4 * 1024 * 1024;
const upload = (qs, body, type) => fetch("/api/upload?key=" + encodeURIComponent(KEY) + "&" + qs,
  { method: "POST", headers: { "content-type": type }, body });

$("pub").onclick = async () => {
  const title = $("nt").value.trim(), text = $("nx").value.trim();
  const fs = [...$("nf").files].filter(f => f.size > 0);
  if (!title && !text && !fs.length) return;
  const st = $("ns"); $("pub").disabled = true;
  try {
    const id = String(Date.now()), files = [];
    for (const [i, f] of fs.entries()) {
      const parts = Math.ceil(f.size / CHUNK), type = f.type || "application/octet-stream";
      for (let p = 0; p < parts; p++) {
        st.textContent = `Subiendo ${f.name} (${p + 1}/${parts})...`;
        const r = await upload(`kind=part&post=${id}&file=${i}&part=${p}&parts=${parts}` +
          `&type=${encodeURIComponent(type)}&name=${encodeURIComponent(f.name)}`,
          f.slice(p * CHUNK, (p + 1) * CHUNK), "application/octet-stream");
        if (!r.ok) throw 0;
      }
      files.push({ key: `${id}-${i}`, type, name: f.name });
    }
    if (!(await upload("kind=post", JSON.stringify({ id, title, text, files }), "application/json")).ok) throw 0;
    $("nt").value = $("nx").value = $("nf").value = "";
    st.textContent = "Publicado."; start();
  } catch (e) { st.textContent = "Error al subir."; }
  $("pub").disabled = false;
};

start();
</script>
</body>
</html>
